name: rewrite-article

on:
  workflow_dispatch:
    inputs:
      target_file:
        description: 'Target HTML file'
        required: true
        default: 'guide-dashcam-howto-choose.html'
      rewrite_instruction:
        description: 'Rewrite instruction'
        required: false
        default: 'Update to latest info and improve SEO'

jobs:
  rewrite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-genai
      - name: rewrite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_FILE: ${{ github.event.inputs.target_file }}
          REWRITE_INSTRUCTION: ${{ github.event.inputs.rewrite_instruction }}
        run: python .github/scripts/rewrite.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "auto rewrite $(date '+%Y-%m-%d')"
          git push
