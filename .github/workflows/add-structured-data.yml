              "price": "3980",
              "rating": "4.3",
              "ratingCount": "1",
              "category": "カーケア"
            },
          }

          def make_review_schema(filename, data):
              url = f"{BASE_URL}/{filename}"
              schema = {
                "@context": "https://schema.org",
                "@type": "Product",
                "name": data["name"],
                "description": data["description"],
                "url": url,
                "category": data["category"],
                "offers": {
                  "@type": "Offer",
                  "priceCurrency": "JPY",
                  "price": data["price"],
                  "availability": "https://schema.org/InStock",
                  "url": url
                },
                "aggregateRating": {
                  "@type": "AggregateRating",
                  "ratingValue": data["rating"],
                  "bestRating": "5",
                  "worstRating": "1",
                  "ratingCount": data["ratingCount"]
                },
                "review": {
                  "@type": "Review",
                  "reviewRating": {
                    "@type": "Rating",
                    "ratingValue": data["rating"],
                    "bestRating": "5"
                  },
                  "author": {
                    "@type": "Person",
                    "name": "DRIVE GEAR LAB"
                  },
                  "publisher": {
                    "@type": "Organization",
                    "name": "DRIVE GEAR LAB"
                  }
                }
              }
              return f'<script type="application/ld+json">\n{json.dumps(schema, ensure_ascii=False, indent=2)}\n</script>'

          def make_website_schema():
              schema = {
                "@context": "https://schema.org",
                "@type": "WebSite",
                "name": "DRIVE GEAR LAB",
                "url": BASE_URL,
                "description": "車用品・ガジェット・電化製品・便利グッズを実際に使って正直レビュー。楽天で買えるおすすめアイテム情報。",
                "publisher": {
                  "@type": "Organization",
                  "name": "DRIVE GEAR LAB",
                  "url": BASE_URL
                }
              }
              return f'<script type="application/ld+json">\n{json.dumps(schema, ensure_ascii=False, indent=2)}\n</script>'

          def make_article_schema(filename, title):
              url = f"{BASE_URL}/{filename}"
              schema = {
                "@context": "https://schema.org",
                "@type": "Article",
                "headline": title,
                "url": url,
                "author": {
                  "@type": "Person",
                  "name": "DRIVE GEAR LAB"
                },
                "publisher": {
                  "@type": "Organization",
                  "name": "DRIVE GEAR LAB",
                  "url": BASE_URL
                }
              }
              return f'<script type="application/ld+json">\n{json.dumps(schema, ensure_ascii=False, indent=2)}\n</script>'

          def get_title(content):
              m = re.search(r'<title>(.*?)</title>', content)
              return m.group(1) if m else "DRIVE GEAR LAB"

          import glob
          html_files = glob.glob('*.html')
          print(f"{len(html_files)} 件のHTMLファイルを処理します...\n")

          for filepath in sorted(html_files):
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()

              # すでに挿入済みならスキップ
              if 'application/ld+json' in content:
                  print(f"  [SKIP] {filepath}")
                  continue

              # スキーマ生成
              if filepath in REVIEW_DATA:
                  schema_tag = make_review_schema(filepath, REVIEW_DATA[filepath])
              elif filepath == 'index.html':
                  schema_tag = make_website_schema()
              elif filepath.startswith('guide-'):
                  title = get_title(content)
                  schema_tag = make_article_schema(filepath, title)
              else:
                  print(f"  [SKIP] {filepath} (対象外)")
                  continue

              # </head> の直前に挿入
              if '</head>' in content:
                  new_content = content.replace('</head>', schema_tag + '\n</head>', 1)
                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.write(new_content)
                  print(f"  [OK]   {filepath}")
              else:
                  print(f"  [WARN] {filepath} — </head>タグなし")

          print("\n完了！")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html
          git diff --cached --quiet || git commit -m "feat: 構造化データ (JSON-LD) を全ページに追加"
          git push
