name: 記事自動リライト

on:
  workflow_dispatch:
    inputs:
      target_file:
        description: 'リライト対象のHTMLファイル（例: guide-dashcam-howto-choose.html）'
        required: true
        default: 'guide-dashcam-howto-choose.html'
      rewrite_instruction:
        description: 'リライトの指示（例: 2026年版に更新、価格情報を見直す）'
        required: false
        default: '最新情報に更新し、SEOを改善してください'

jobs:
  rewrite:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install google-generativeai

      - name: 記事をリライト
